# Phase 1 (pull request) and phase 2 (merge to main): lint, type check, unit tests.
# See RELEASE.md.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to a pull request supersedes its running checks. Runs on main are never
# cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/_test.yml

# Reusable: runs every check. Called by ci.yml (phases 1 and 2) and release.yml (phase 3).
name: "Reusable: test"

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to check (defaults to the triggering commit)
        type: string
        default: ''

permissions:
  contents: read

# Explicit bash runs steps with -eo pipefail (the implicit default has no pipefail).
defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Release script tests
        run: python3 -m unittest discover -s .github/scripts

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:ci
